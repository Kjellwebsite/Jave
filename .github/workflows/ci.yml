name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jave
          POSTGRES_PASSWORD: jave
          POSTGRES_DB: jave
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jave" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://jave:jave@localhost:5432/jave
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Migrations are in sync with the schema
        run: pnpm db:check && pnpm --filter @jave/database exec drizzle-kit generate --name ci-drift-check && git diff --exit-code packages/database/drizzle
      - name: Migrate a real Postgres
        run: pnpm db:migrate
      - name: Unit + integration tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
