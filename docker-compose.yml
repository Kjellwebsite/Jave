# Local development dependencies. `docker compose up -d` then `pnpm db:migrate`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jave
      POSTGRES_PASSWORD: jave
      POSTGRES_DB: jave
    ports:
      - '5432:5432'
    volumes:
      - jave-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jave']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jave-postgres:
